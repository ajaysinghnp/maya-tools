name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Source checks
        shell: pwsh
        run: ./scripts/check.ps1

      - name: Verify the committed build matches the tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart("v")
          $file = "releases/MayaTools-$tag.xlam"

          if ((Get-Content VERSION -Raw).Trim() -ne $ver) { throw "VERSION file does not match tag $tag" }
          if (-not (Test-Path $file)) { throw "$file is missing. Run scripts/release.ps1 so the build is committed." }

          # a valid .xlam is a zip containing the VBA project and the ribbon
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $file))
          $names = $z.Entries.FullName
          $z.Dispose()
          if ("xl/vbaProject.bin" -notin $names) { throw "No VBA project inside $file" }
          if ("customUI/customUI14.xml" -notin $names) { throw "No ribbon inside $file" }

          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "SHA-256 of ``MayaTools-$tag.xlam``: ``$hash``" | Set-Content release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          FLAGS=""
          case "$TAG" in *-*) FLAGS="--prerelease" ;; esac
          gh release create "$TAG" "releases/MayaTools-$TAG.xlam" \
            --title "$TAG" --notes-file release-notes.md --generate-notes $FLAGS